name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
      packages: write
    uses: actionsforge/actions/.github/workflows/docker-image-release.yml@main
    with:
      build-args: |
        HEADLAMP_VERSION=main
        NODE_VERSION=22.9.0
        GO_VERSION=1.25.6
    secrets: inherit
